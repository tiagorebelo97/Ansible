---
# OpenShift Cluster Inventory
# 3 Masters + 3 Workers configuration

all:
  children:
    openshift:
      children:
        masters:
          hosts:
            master01:
              ansible_host: 10.0.0.11
              ansible_user: root
              node_type: master
              openshift_node_group_name: node-config-master
            master02:
              ansible_host: 10.0.0.12
              ansible_user: root
              node_type: master
              openshift_node_group_name: node-config-master
            master03:
              ansible_host: 10.0.0.13
              ansible_user: root
              node_type: master
              openshift_node_group_name: node-config-master
        
        workers:
          hosts:
            worker01:
              ansible_host: 10.0.0.21
              ansible_user: root
              node_type: worker
              openshift_node_group_name: node-config-worker
            worker02:
              ansible_host: 10.0.0.22
              ansible_user: root
              node_type: worker
              openshift_node_group_name: node-config-worker
            worker03:
              ansible_host: 10.0.0.23
              ansible_user: root
              node_type: worker
              openshift_node_group_name: node-config-worker
        
        # Bootstrap node (temporary, used during installation)
        bootstrap_node:
          hosts:
            bootstrap:
              ansible_host: 10.0.0.10
              ansible_user: root
              node_type: bootstrap
  
  vars:
    ansible_python_interpreter: /usr/bin/python3
