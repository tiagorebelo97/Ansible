---
# Common tasks for all OpenShift nodes

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  tags: hostname

- name: Update /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ ansible_host }} {{ inventory_hostname }}"
    state: present
  tags: hosts

- name: Disable swap
  ansible.builtin.command: swapoff -a
  changed_when: false
  tags: swap

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent
  tags: swap

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
  tags: timezone

- name: Configure SELinux
  ansible.posix.selinux:
    policy: targeted
    state: "{{ selinux_state }}"
  tags: selinux

- name: Install required packages
  ansible.builtin.yum:
    name:
      - curl
      - wget
      - vim
      - net-tools
      - bind-utils
      - chrony
      - openssl
      - tar
      - unzip
    state: present
  tags: packages

- name: Start and enable chronyd
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true
  tags: ntp

- name: Configure NTP servers
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^server '
    line: "server {{ item }} iburst"
    state: present
  loop: "{{ ntp_servers }}"
  notify: restart chronyd
  tags: ntp
