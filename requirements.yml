  - name: kubernetes.core
    version: ">=2.4.0"
  
  - name: community.kubernetes
    version: ">=2.0.0"
  
  # General purpose collections
  - name: community.general
    version: ">=7.0.0"
  
  - name: ansible.posix
    version: ">=1.5.0"
  
  # Red Hat collections (if available)
  - name: redhat.openshift
    version: ">=2.3.0"

